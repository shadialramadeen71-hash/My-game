<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Star Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Bangers&display=swap">
<style>
/* Layout: full-bleed 3D stage; cinema overlays — progress on top, subtitles + transport at the bottom */
:root{
  --night:#0b1236; --ink:#f6f3ff; --muted:#aab2dc; --glass:rgba(9,11,34,.74); --line:rgba(255,255,255,.16);
  --gold:#ffd21f; --ember:#ff8a3d; --teal:#3fe0c8; --villain:#ff4d6d; --narr:#c9d1ff;
  --display:'Bangers','Impact',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(4,5,20,.55))}
button{font-family:var(--body);font-weight:600;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:.7em 1.3em;font-size:1rem;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(6px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button.primary{background:var(--gold);color:#1b1300;border-color:transparent;font-weight:800}
button:active{transform:scale(.97)}

#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(6,8,28,.92) 0%,rgba(6,8,28,.55) 38%,transparent 65%)}
#menu .eyebrow{margin:0;color:var(--muted);letter-spacing:.04em;font-size:.95rem}
#menu h1{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:clamp(3.2rem,15vw,6.5rem);line-height:1;color:var(--gold);text-shadow:0 4px 0 #8a4a00,0 0 30px rgba(255,210,31,.35);text-wrap:balance}
#menu .ep{margin:4px 0 0;font-size:1.15rem}
#menu .ep b{color:var(--teal)}
.cast{display:flex;flex-wrap:wrap;gap:8px}
.cast span{padding:.25em .8em;border-radius:999px;border:1px solid var(--c);color:var(--c);font-weight:600;font-size:.9rem;background:rgba(0,0,0,.25)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.hint{margin:0;color:var(--muted);font-size:.85rem}

#hud{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
#prog{height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold))}
#hud .row{display:flex;justify-content:space-between;margin-top:8px;font-size:.85rem;color:var(--muted)}
#chip{background:var(--glass);border:1px solid var(--line);padding:.2em .8em;border-radius:999px;color:var(--ink)}
#time{font-variant-numeric:tabular-nums;background:var(--glass);padding:.2em .7em;border-radius:999px}

#card{position:fixed;left:16px;right:16px;top:22%;text-align:center;pointer-events:none;opacity:0;transform:scale(.92);transition:opacity .6s,transform .6s}
#card.on{opacity:1;transform:none}
#card h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12vw,5.5rem);color:var(--gold);text-shadow:0 4px 0 #8a4a00,0 0 28px rgba(255,210,31,.4);line-height:1.05}
#card p{margin:.4em 0 0;font-size:clamp(1.05rem,4.5vw,1.6rem);font-weight:800;color:var(--ink);text-shadow:0 2px 10px rgba(0,0,0,.8)}

#sub{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(92vw,760px);text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#sub b{font-size:.85rem;padding:.15em .8em;border-radius:999px;background:var(--who,var(--narr));color:#111;font-weight:800}
#sub span{background:var(--glass);border:1px solid var(--line);padding:.45em .9em;border-radius:14px;font-size:clamp(1.05rem,4.4vw,1.5rem);font-weight:600;line-height:1.5;text-wrap:balance}

#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#ctrl button{width:52px;height:52px;padding:0;display:grid;place-items:center}
#ctrl svg{width:22px;height:22px;fill:currentColor}
#ctrl #bPause{width:62px;height:62px;background:var(--gold);color:#1b1300;margin-top:-5px}

#gal{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#gal .sheet{width:min(100%,560px);background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:10px;backdrop-filter:blur(8px)}
#gal h3{margin:0;font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;color:var(--who)}
#gal .role{margin:0;color:var(--muted);font-weight:600}
#gal .bio{margin:0;line-height:1.7;font-size:1rem}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.85rem}
.stats .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.stats .bar i{display:block;height:100%;background:var(--who);border-radius:8px}
.stats em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
#gal .nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

#endS{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
#msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:1.1rem;color:var(--muted);background:var(--night)}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" aria-label="3D Star City"></canvas>
<div id="vig"></div>

<section id="menu" hidden>
  <div>
    <p class="eyebrow">A 3D animated superhero series</p>
    <h1>Star Squad</h1>
    <p class="ep">Episode 1 · <b>The Crystal of Light</b></p>
  </div>
  <div class="cast">
    <span style="--c:var(--gold)">Bolt ⚡</span>
    <span style="--c:var(--ember)">Boulder 🪨</span>
    <span style="--c:var(--teal)">Breeze 🌪️</span>
    <span style="--c:var(--villain)">Doctor Darkness</span>
  </div>
  <div class="actions">
    <button id="bPlay" class="primary">▶ Watch the episode</button>
    <button id="bCast">Meet the heroes</button>
  </div>
  <p class="hint">Turn your sound on 🔊 · full voice acting · about 1½ minutes</p>
</section>

<header id="hud" hidden>
  <div id="prog"><i></i></div>
  <div class="row"><span id="chip"></span><span id="time"></span></div>
</header>

<div id="card"><h2></h2><p></p></div>
<div id="sub" hidden><b></b><span></span></div>

<nav id="ctrl" hidden>
  <button id="bHome" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
  <button id="bRestart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
  <button id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><path id="pIcon" d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
  <button id="bNext" aria-label="Next scene"><svg viewBox="0 0 24 24"><path d="M18 6h-2v12h2zM4 18l9-6-9-6z"/></svg></button>
  <button id="bMute" aria-label="Sound"><svg viewBox="0 0 24 24"><path id="mIcon" d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
</nav>

<section id="gal" hidden>
  <div class="sheet" id="galSheet">
    <h3 id="gName"></h3>
    <p class="role" id="gRole"></p>
    <p class="bio" id="gBio"></p>
    <div class="stats" id="gStats"></div>
    <div class="nav">
      <button id="gPrev">← Previous</button>
      <button id="gBack">Menu</button>
      <button id="gNext">Next →</button>
    </div>
  </div>
</section>

<section id="endS" hidden>
  <button id="eAgain" class="primary">↺ Watch again</button>
  <button id="eCast">Meet the heroes</button>
  <button id="eMenu">Menu</button>
</section>

<div id="msg">Loading Star City…</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const lerp = (a,b,t) => a+(b-a)*t;
const sm = t => { t=clamp(t); return t*t*(3-2*t); };
const eo = t => { t=clamp(t); return 1-Math.pow(1-t,3); };
const ei = t => { t=clamp(t); return t*t*t; };
const seg = (lt,a,b) => clamp((lt-a)/(b-a));
let seed = 11;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= renderer ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1236);
scene.fog = new THREE.Fog(0x0b1236, 70, 190);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
const look = V();
// Blender-style render: image-based lighting + bloom (like Eevee)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256,256), .5, .45, .9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w, h, false); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h);
  camera.aspect = a; camera.fov = a < .8 ? 72 : a < 1.2 ? 60 : 48;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ================= materials (Blender-style physically based shading) ================= */
const grad = new THREE.DataTexture(new Uint8Array([80,80,80,255, 165,165,165,255, 255,255,255,255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, o={}) => new THREE.MeshPhysicalMaterial({color, roughness:.42, metalness:0, clearcoat:.35, clearcoatRoughness:.35, ...o});
const skinMat = color => new THREE.MeshPhysicalMaterial({color, roughness:.55, sheen:.6, sheenColor:new THREE.Color(0xff9c80), sheenRoughness:.45});
const eyeMat = color => new THREE.MeshPhysicalMaterial({color, roughness:.08, clearcoat:1, clearcoatRoughness:.05});
const matte = (color, o={}) => new THREE.MeshStandardMaterial({color, roughness:.85, metalness:0, ...o});
const outlineMat = new THREE.ShaderMaterial({
  uniforms:{thick:{value:0.03}},
  vertexShader:'uniform float thick; void main(){ gl_Position = projectionMatrix*modelViewMatrix*vec4(position+normal*thick,1.0); }',
  fragmentShader:'void main(){ gl_FragColor = vec4(0.07,0.05,0.12,1.0); }',
  side:THREE.BackSide
});
const edgeMat = new THREE.LineBasicMaterial({color:0x14102a});
function part(geo, mat, parent, p=[0,0,0], s=null, r=null, outline=true){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...p); if(s) m.scale.set(...s); if(r) m.rotation.set(...r);
  m.castShadow = true; parent.add(m);
  return m;
}
function edges(mesh){ return mesh; }
const basic = (color, o={}) => new THREE.MeshBasicMaterial({color, ...o});
function makeDot(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
}
const dotTex = makeDot();
const glowSprite = (color, s, op=1) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex, color, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false})); sp.scale.set(s,s,1); return sp; };

/* ================= characters ================= */
function boltEmblem(m, bg){
  const g = new THREE.Group();
  part(new THREE.CylinderGeometry(.24,.24,.04,28), toon(bg), g, [0,0,0], null, [Math.PI/2,0,0], false);
  const s = new THREE.Shape();
  [[-.05,.2],[.12,.2],[.03,.04],[.13,.04],[-.09,-.22],[-.02,-.03],[-.12,-.03]].forEach(([x,y],i)=> i? s.lineTo(x,y) : s.moveTo(x,y));
  part(new THREE.ExtrudeGeometry(s,{depth:.05,bevelEnabled:false}), m, g, [0,0,.0], null, null, false);
  return g;
}
function rockEmblem(m, bg){
  const g = new THREE.Group();
  part(new THREE.CylinderGeometry(.25,.25,.04,6), toon(bg), g, [0,0,0], null, [Math.PI/2,0,0], false);
  const s = new THREE.Shape(); s.moveTo(-.17,-.12); s.lineTo(-.05,.12); s.lineTo(.02,.0); s.lineTo(.08,.08); s.lineTo(.18,-.12); s.lineTo(-.17,-.12);
  part(new THREE.ExtrudeGeometry(s,{depth:.05,bevelEnabled:false}), m, g, [0,0,0], null, null, false);
  return g;
}
function windEmblem(m, bg){
  const g = new THREE.Group();
  part(new THREE.CylinderGeometry(.24,.24,.04,28), toon(bg), g, [0,0,0], null, [Math.PI/2,0,0], false);
  part(new THREE.TorusGeometry(.13,.035,8,24,Math.PI*1.5), m, g, [0,0,.03], null, null, false);
  part(new THREE.TorusGeometry(.06,.03,8,16,Math.PI*1.4), m, g, [.02,0,.03], null, [0,0,2], false);
  return g;
}
function moonEmblem(m, bg){
  const g = new THREE.Group();
  part(new THREE.CylinderGeometry(.25,.25,.04,28), toon(bg), g, [0,0,0], null, [Math.PI/2,0,0], false);
  part(new THREE.TorusGeometry(.13,.05,8,24,Math.PI*1.2), m, g, [0,0,.03], null, [0,0,1.5], false);
  return g;
}

function makeHero(o){
  const S = o.bulk || 1;
  const root = new THREE.Group(), rig = new THREE.Group(); root.add(rig);
  const suit = toon(o.suit), acc = toon(o.accent), skin = skinMat(o.skin), glove = toon(o.glove ?? o.accent), bootM = toon(o.boot ?? o.accent);
  const legs = [1,-1].map(sd => {
    const p = new THREE.Group(); p.position.set(.22*S*sd, .95, 0); rig.add(p);
    part(new THREE.CapsuleGeometry(.17*S,.42,12,28), suit, p, [0,-.38,0]);
    part(new THREE.SphereGeometry(.2*S,40,28), bootM, p, [0,-.8,.06], [1,.75,1.35]);
    return p;
  });
  const torso = new THREE.Group(); torso.position.y = 1.0; rig.add(torso);
  part(new THREE.CapsuleGeometry(.42*S,.45,12,28), suit, torso, [0,.42,0]);
  part(new THREE.TorusGeometry(.43*S,.07,8,28), acc, torso, [0,.08,0], null, [Math.PI/2,0,0], false);
  const em = o.emblem(toon(o.emblemColor ?? o.accent), o.emblemBg ?? 0xffffff); em.position.set(0,.62,.42*S+.01); torso.add(em);
  const arms = [1,-1].map(sd => {
    const p = new THREE.Group(); p.position.set((.42*S+.1)*sd, 1.78, 0); rig.add(p);
    part(new THREE.CapsuleGeometry(.13*S,.38,12,28), suit, p, [0,-.3,0]);
    part(new THREE.SphereGeometry(.17*S,40,28), glove, p, [0,-.66,0]);
    if(o.pads) part(new THREE.DodecahedronGeometry(.3*S,0), toon(o.pads), p, [0,.02,0], null, null, false);
    return p;
  });
  const head = new THREE.Group(); head.position.y = 2.55; rig.add(head);
  part(new THREE.SphereGeometry(.58,40,28), skin, head);
  if(o.mask) part(new THREE.SphereGeometry(.597,40,28,0,Math.PI*2,1.22,.52), toon(o.mask), head, [0,0,0], null, null, false);
  for(const sd of [1,-1]){
    const w = new THREE.Mesh(new THREE.SphereGeometry(.15,40,28), o.evil ? basic(0xff2a4a) : eyeMat(0xffffff));
    w.position.set(.2*sd,.04,.54); w.scale.set(1,1.3,.6); head.add(w);
    if(o.evil){ const gl = glowSprite(0xff2a4a,.7,.8); gl.position.set(.2*sd,.04,.62); head.add(gl); }
    else {
      const p = new THREE.Mesh(new THREE.SphereGeometry(.075,40,28), eyeMat(0x1a1030)); p.position.set(.19*sd,.03,.63); p.scale.z=.5; head.add(p);
      const hl = new THREE.Mesh(new THREE.SphereGeometry(.026,8,6), basic(0xffffff)); hl.position.set(.19*sd+.03,.08,.67); head.add(hl);
    }
    const brow = new THREE.Mesh(new THREE.CapsuleGeometry(.03,.14,12,28), toon(o.brow ?? 0x2a1a10));
    brow.rotation.z = Math.PI/2 + (o.evil ? .45*sd : -.12*sd); brow.position.set(.2*sd,.27,.52); head.add(brow);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(.11,.028,12,24,Math.PI), eyeMat(o.evil ? 0x200818 : 0x7a1a2a));
  mouth.position.set(0,-.2,.55); mouth.rotation.set(-.25,0,o.evil ? 0 : Math.PI); head.add(mouth);
  o.hair && o.hair(head);
  let cape = null;
  if(o.cape){
    const geo = new THREE.PlaneGeometry(1.0*S,1.55,6,10); geo.translate(0,-.775,0);
    cape = new THREE.Mesh(geo, toon(o.cape,{side:THREE.DoubleSide})); cape.position.set(0,2.02,-.44*S); cape.castShadow = true; rig.add(cape);
    cape.userData.base = geo.attributes.position.array.slice();
  }
  root.traverse(m => { if(m.isMesh && m.material !== outlineMat) m.castShadow = true; });
  return {root, rig, head, torso, armL:arms[0], armR:arms[1], legL:legs[0], legR:legs[1], mouth, cape, capeSpeed:0, seed:rnd()*6, baseScale:o.scale ?? 1};
}

function hairBarq(h){
  part(new THREE.SphereGeometry(.62,40,28,0,Math.PI*2,0,1.15), toon(0x2166e8), h, [0,.02,-.02], null, null, false);
  for(const sd of [1,-1]){
    part(new THREE.ConeGeometry(.11,.5,8), toon(0xffd21f), h, [.6*sd,.22,-.05], null, [0,0,-1.25*sd]);
    part(new THREE.ConeGeometry(.08,.35,8), toon(0xffd21f), h, [.58*sd,.4,-.1], null, [0,0,-.85*sd]);
  }
  part(new THREE.ConeGeometry(.1,.4,6), toon(0xffd21f), h, [0,.68,.05], null, [.3,0,0]);
}
function hairSakhr(h){
  part(new THREE.CylinderGeometry(.48,.58,.36,18), toon(0x3a2416), h, [0,.42,-.03]);
  part(new THREE.SphereGeometry(.6,40,28,0,Math.PI*2,0,.9), toon(0x3a2416), h, [0,.05,-.06], null, null, false);
}
function hairNasma(h){
  const hairM = toon(0x4a2a7a,{roughness:.55,sheen:.8,sheenColor:new THREE.Color(0xb48cff)});
  part(new THREE.SphereGeometry(.625,40,28,Math.PI*.15,Math.PI*1.7,0,1.45), hairM, h, [0,.03,-.02], null, [0,Math.PI,0], false);
  part(new THREE.SphereGeometry(.625,40,28,0,Math.PI*2,0,.75), hairM, h, [0,.03,0], null, null, false);
  part(new THREE.SphereGeometry(.2,40,28), hairM, h, [0,.3,-.62]);
  part(new THREE.ConeGeometry(.2,.85,12), hairM, h, [0,-.2,-.78], null, [-.35+Math.PI,0,0]);
  part(new THREE.TorusGeometry(.62,.035,6,32,Math.PI*.6), toon(0xffd21f), h, [0,.22,0], null, [Math.PI/2-.35,0,Math.PI*.2], false);

/* ================= voices: every line is spoken (Web Speech API, built into the device) ================= */
const Voice = (() => {
  const synth = window.speechSynthesis;
  let voices = [], muted = false, who = null, n = 0;
  const load = () => { voices = synth ? synth.getVoices().filter(v => /^en/i.test(v.lang)) : []; };
  if(synth){ load(); synth.addEventListener?.('voiceschanged', load); }
  const FEMALE = /female|samantha|victoria|karen|moira|tessa|fiona|zira|aria|jenny|susan|serena|allison|ava|libby|sonia|natasha|michelle/i;
  const MALE = /\bmale|daniel|alex|fred|david|mark|guy|ryan|george|aaron|arthur|oliver|thomas|rishi|christopher|eric|james/i;
  const pick = (kind, i) => {
    const f = voices.filter(v => FEMALE.test(v.name)), m = voices.filter(v => MALE.test(v.name) && !/female/i.test(v.name));
    const list = kind === 'f' ? f : m;
    return list.length ? list[i % list.length] : (voices[0] || null);
  };
  // each character: voice gender, which voice, pitch (0-2), speed
  const CAST = {narr:['m',0,1,.95], barq:['m',1,1.55,1.15], sakhr:['m',2,.55,.88], nasma:['f',0,1.25,1.05], dhalam:['m',0,.2,.82]};
  const clean = t => t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu, '').trim();
  return {
    get who(){ return who; },
    get active(){ return !!synth && voices.length > 0 && !muted; },
    unlock(){ if(synth){ load(); const u = new SpeechSynthesisUtterance(''); u.volume = 0; synth.speak(u); } },
    say(k, text){
      if(!synth || muted) return;
      const [g, i, pitch, rate] = CAST[k], u = new SpeechSynthesisUtterance(clean(text)), id = ++n;
      u.lang = 'en-US'; const v = pick(g, i); if(v) u.voice = v;
      u.pitch = pitch; u.rate = rate; u.volume = 1;
      u.onstart = () => { who = k; Sound.duck(true); };
      u.onend = u.onerror = () => { if(id === n || !synth.speaking){ who = null; Sound.duck(false); } };
      synth.speak(u);
    },
    stop(){ if(synth) synth.cancel(); who = null; Sound.duck(false); },
    setMuted(m){ muted = m; if(m) this.stop(); },
  };
})();

function robotMarch(i, t){
  const s = .5 + i*.22, e = s + 1.1, from = SAUCER.clone().add(V(0,-1,0)), to = RT[i];
  if(t < s) return null;
  if(t < e){ const u = (t-s)/1.1; return V(lerp(from.x,to.x,u), lerp(from.y,0,u*u), lerp(from.z,to.z,u)); }
  const dir = CENTER.clone().sub(to); const dist = dir.length(); dir.normalize();
  return to.clone().addScaledVector(dir, Math.min((t-e)*.7, dist-4.5));
}

}

}
const GAL = [
  {k:'barq', hello:"I'm Bolt, the fastest kid in the world!", name:'Bolt', role:'Super Speed ⚡', col:'var(--gold)', bio:'The fastest kid in the world. He runs like lightning, leaves yellow sparks behind him, and cracks jokes even in the toughest fights.', stats:[['Speed',10],['Strength',5],['Flight',2],['Brains',7]]},
  {k:'sakhr', hello:"I'm Boulder. Strong as a mountain!", name:'Boulder', role:'Rock Power 🪨', col:'var(--ember)', bio:'Strong as a mountain with a heart of gold. One punch shakes the ground, and he builds rock shields to protect his friends.', stats:[['Speed',3],['Strength',10],['Flight',1],['Brains',6]]},
  {k:'nasma', hello:"I'm Breeze, leader of the Star Squad!", name:'Breeze', role:'Wind Master 🌪️', col:'var(--teal)', bio:'The team\'s clever leader. She rides the wind, spins up tornadoes, and always finds a plan to win.', stats:[['Speed',7],['Strength',5],['Flight',10],['Brains',9]]},
  {k:'dhalam', hello:"Ha ha ha! I am Doctor Darkness!", name:'Doctor Darkness', role:'The Villain 🌑', col:'var(--villain)', bio:'An evil scientist who hates the light. He rides a flying saucer with a robot army and dreams of plunging Star City into darkness.', stats:[['Speed',4],['Strength',6],['Flight',8],['Brains',9]]},
];
const GPOS = {barq:V(-4.8,0,0), sakhr:V(-1.6,0,0), nasma:V(1.6,0,0), dhalam:V(4.8,0,0)};
function openGallery(i=0){
  Sound.init(); Voice.unlock(); mode = 'gallery'; gi = i; baseState(); setCard(false); setSub(null);
  for(const g of GAL){ const h = H[g.k]; h.root.visible = true; h.root.position.copy(GPOS[g.k]); h.root.rotation.y = 0; h.root.scale.setScalar(h.baseScale); }
  camera.position.set(0,3,9); look.set(0,2,0);
  show('menu',false); show('endS',false); show('hud',false); show('ctrl',false); show('gal',true);
  renderGal();
}
function renderGal(){
  const g = GAL[gi];
  $('galSheet').style.setProperty('--who', g.col);
  $('gName').textContent = g.name; $('gRole').textContent = g.role; $('gBio').textContent = g.bio;
  $('gStats').innerHTML = g.stats.map(([n,v]) => `<span>${n}</span><span class="bar"><i style="width:${v*10}%"></i></span><em>${v}/10</em>`).join('');
  Sound.setMood(g.k === 'dhalam' ? 'villain' : 'heroic');
  Voice.stop(); Voice.say(g.k, g.hello);
  galFx = 0;
}
let galFx = 0;
function setPauseIcon(){ $('pIcon').setAttribute('d', paused ? 'M7 4v16l13-8z' : 'M6 4h4v16H6zm8 0h4v16h-4z'); $('bPause').setAttribute('aria-label', paused ? 'Play' : 'Pause'); }

$('bPlay').onclick = startEpisode;
$('bCast').onclick = () => openGallery(0);
$('eAgain').onclick = startEpisode;
$('eCast').onclick = () => openGallery(0);
$('eMenu').onclick = toMenu;
$('bHome').onclick = toMenu;
$('bRestart').onclick = startEpisode;
$('bPause').onclick = () => { if(ended) return; paused = !paused; paused ? (Sound.pause(), Voice.stop()) : Sound.resume(); setPauseIcon(); };
$('bNext').onclick = () => { if(cur < scenes.length-1){ Voice.stop(); T = scenes[cur+1].start; if(paused){ paused = false; Sound.resume(); setPauseIcon(); } } };
$('bMute').onclick = () => { const m = Sound.toggleMute(); Voice.setMuted(m); $('mIcon').setAttribute('d', m ? 'M3 9v6h4l5 5V4L7 9zm16.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z' : 'M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z'); };
$('gPrev').onclick = () => { gi = (gi + GAL.length - 1) % GAL.length; renderGal(); };
$('gNext').onclick = () => { gi = (gi + 1) % GAL.length; renderGal(); };
$('gBack').onclick = toMenu;
addEventListener('keydown', e => { if(mode === 'episode' && e.code === 'Space'){ e.preventDefault(); $('bPause').click(); } });

/* ================= main loop ================= */
let last = performance.now(), clock = 0;
function frame(now){
  requestAnimationFrame(frame);
  const real = Math.min(.25, (now - last)/1000), rdt = Math.min(.05, real); last = now;
  const dt = (mode === 'episode' && paused) ? 0 : rdt;
  clock += dt;

  if(mode === 'episode'){
    if(!paused) T += real;
    const tt = Math.min(T, TOTAL - .001);
    let i = scenes.findIndex(s => tt >= s.start && tt < s.start + s.dur); if(i < 0) i = scenes.length-1;
    if(i !== cur) enterScene(i);
    const s = scenes[i], lt = (T >= TOTAL ? T : tt) - s.start;
    for(const [t, fn] of s.ev) if(t > prevLt && t <= lt && dt) fn();
    if(dt || prevLt < 0) prevLt = lt;
    s.run.call(s, lt, dt);
    const line = s.lines.find(l => lt >= l[0] && lt < l[0] + l[3]);
    setSub(line || null);
    const tw = Voice.active ? Voice.who : (line && line[1]);
    if(tw && H[tw] && H[tw].root.visible) talk(H[tw], clock);
    $('prog').firstElementChild.style.width = (Math.min(T,TOTAL)/TOTAL*100) + '%';
    $('time').textContent = fmt(Math.min(T,TOTAL)) + ' / ' + fmt(TOTAL);
    if(T >= TOTAL && !ended){ ended = true; show('endS',true); show('ctrl',false); setSub(null); }
  } else if(mode === 'menu'){
    menuT += dt;
    const a = menuT*.06; camera.position.set(Math.sin(a)*16, 6 + Math.sin(menuT*.2)*1.5, Math.cos(a)*16 + 2); look.set(0,3.2,-2);
    HEROES.forEach((k,i) => { const h = H[k]; h.root.rotation.y = 0; ((menuT + i*1.7) % 6) < 1.4 ? P_cheer(h,menuT,i) : (k === 'sakhr' ? P_idle(h,menuT) : P_hero(h,menuT)); });
  } else if(mode === 'gallery'){
    const g = GAL[gi], h = H[g.k], p = GPOS[g.k];
    const portrait = camera.aspect < .8;
    camera.position.lerp(V(p.x, 2.4, portrait ? 8 : 7), 1 - Math.exp(-dt*3));
    look.lerp(V(p.x, portrait ? .4 : .9, 0), 1 - Math.exp(-dt*3));
    for(const q of GAL){ const hh = H[q.k]; if(q !== g){ P_idle(hh,clock); hh.root.rotation.y = lerp(hh.root.rotation.y, 0, .1); } }
    galFx += dt; const k = galFx % 4.5;
    if(g.k === 'barq'){ k < 1.2 ? P_run(h,clock,20) : P_hero(h,clock); h.root.rotation.y = k < 1.2 ? Math.PI/2 : 0; if(k < 1.2 && dt) emit(p.clone().add(V(-.5,1.4,0)), 0xffe04a, 3, 1, .45, .5, 0); }
    else if(g.k === 'sakhr'){ k < 1.5 ? P_flex(h,clock) : P_hero(h,clock); if(k < dt*1.01 && dt){ ring(V(p.x,.2,0), 0xffb36b, 6); Sound.punch(); } }
    else if(g.k === 'nasma'){ P_hover(h,clock); h.root.position.y = .6 + Math.sin(clock*2)*.2; tornado.visible = true; tornado.position.set(p.x,-.3,0); tornado.scale.setScalar(1); }
    else { k < 1.5 ? P_laugh(h,clock) : P_idle(h,clock); if(dt) emit(p.clone().add(V((Math.random()-.5)*1.5,.3,(Math.random()-.5)*1.5)), 0x9b3dff, 1, .5, 1, .6, 1.5); }
    if(Voice.who === g.k) talk(h, clock);
    if(g.k !== 'nasma'){ tornado.visible = false; H.nasma.root.position.y = 0; }
  }

  // shared animation
  for(const k in H) waveCape(H[k], clock);
  saucer.ring.rotation.y += dt*1.5;
  crystalMesh.rotation.y += dt*1.2;
  if(tornado.visible) tornado.children.forEach((m,i) => { m.rotation.z += dt*(5+i); m.position.x = Math.sin(clock*6+i)*.15; });
  updateParticles(dt); updateRings(dt);
  flashL.intensity *= Math.pow(.02, dt);
  applyEnv(clock);
  const sk = reduceMotion ? 0 : shake; shake *= Math.pow(.03, dt);
  camera.position.x += (Math.random()-.5)*sk; camera.position.y += (Math.random()-.5)*sk;
  camera.lookAt(look);
  composer.render();
}
toMenu();
$('msg').hidden = true;
requestAnimationFrame(frame);
</script>
<script>
  window.addEventListener('error', e => { const m = document.getElementById('msg'); if(m && !m.hidden) m.textContent = 'This device could not start the show. It needs a browser with WebGL.'; });
</script>
