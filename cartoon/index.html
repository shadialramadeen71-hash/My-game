<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Buckleys – Shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0b0b12; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px 0; }
  #wrap { position: relative; width: min(100vw, calc((100vh - 70px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 40px rgba(0,0,0,.8); }
  #wrap:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #2d5fa8, #0d1b3a); cursor: pointer; text-align: center; padding: 16px; }
  #overlay h1 { font-family: 'Lobster', Georgia, serif; font-size: clamp(36px, 9vw, 96px); color: #ffd23f; -webkit-text-stroke: 2px #111; text-shadow: 4px 4px 0 #111; }
  #overlay p { font-size: clamp(13px, 2.2vw, 20px); opacity: .9; }
  #play { font-family: 'Luckiest Guy', Arial, sans-serif; font-size: clamp(18px, 3.5vw, 32px); background: #e8743b; color: #fff; border: 4px solid #111; border-radius: 16px; padding: 12px 34px; cursor: pointer; box-shadow: 0 6px 0 #111; letter-spacing: 1px; }
  #play:active { transform: translateY(4px); box-shadow: 0 2px 0 #111; }
  .ep { background: #fff; color: #111; border: 3px solid #111; border-radius: 12px; padding: 8px 14px; font-weight: bold; cursor: pointer; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 16px; }
  #controls button { background: #1d2333; color: #fff; border: 1px solid #3a4560; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  #controls button:hover { background: #2a3350; }
  #controls button.off { opacity: .5; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="overlay">
    <h1>The Buckleys</h1>
    <p>Shorts · كل حلقة أقل من 40 ثانية<br>مسلسل كرتوني بالكامل مرسوم بالكود · حوار صوتي بالإنجليزية</p>
    <button id="play">▶ Watch</button>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="ep" data-ep="0">#1 The Ticket</button><button class="ep" data-ep="1">#2 Millionaire Town</button><button class="ep" data-ep="2">#3 Half Off</button>
    </div>
    <p style="font-size:13px;opacity:.7">🔊 Turn your sound on · شغّل الصوت</p>
  </div>
</div>
<div id="controls">
  <button id="bPause">⏸ Pause</button>
  <button id="bRestart">⟲ Replay</button>
  <button id="bNext">⏭ Next</button>
  <button data-ep="0">1</button><button data-ep="1">2</button><button data-ep="2">3</button>
  <button id="bVoice">🔊 Voices</button>
  <button id="bSubs">💬 Subtitles</button>
  <button id="bFull">⛶ Fullscreen</button>
</div>

<script>
'use strict';
/* =====================================================================
   THE BUCKLEYS — a code-drawn cartoon episode
   Everything (characters, backgrounds, animation, music, voices)
   is generated at runtime with Canvas 2D, Web Audio and Web Speech.
   ===================================================================== */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1280, H = 720;              // logical stage size
const PI = Math.PI, TAU = PI * 2;
const params = new URLSearchParams(location.search);
const SPEED = parseFloat(params.get('speed') || '1');

let T = 0;                 // episode clock (seconds, stops while paused)
let paused = false;
let voiceOn = params.get('mute') !== '1';
let subsOn = true;
let started = false;

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round((n >> 16) * f), 0, 255), g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255), b = clamp(Math.round((n & 255) * f), 0, 255);
  return `rgb(${r},${g},${b})`;
}

/* ---------------------------------------------------------------------
   Timeline primitives: waits & tweens run on the episode clock T
   --------------------------------------------------------------------- */
const waiters = [], tweens = [];
function wait(s) { return new Promise(r => waiters.push({ at: T + s, r })); }
const EASE = {
  linear: t => t,
  inout: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - (1 - t) * (1 - t),
  in: t => t * t,
  back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
};
function tween(o, to, d, ease = 'inout') {
  return new Promise(res => {
    const from = {};
    for (const k in to) from[k] = o[k];
    tweens.push({ o, from, to, start: T, d: Math.max(d, 0.0001), ease: EASE[ease], res });
  });
}

/* ---------------------------------------------------------------------
   Drawing helpers — Family-Guy-like look: flat fills + thick ink lines
   --------------------------------------------------------------------- */
const INK = '#151515';
let LW = 3.5;
function fs(fill, lw = LW) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function line(pts, w = 3, col = INK) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function limb(pts, w, col) { line(pts, w + LW * 2, INK); line(pts, w, col); }
function blob(circles, col) {   // outlined union of circles (hair, bushes, clouds, smoke)
  for (const [x, y, r] of circles) { ell(x, y, r, r); ctx.lineWidth = LW * 2; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.fillStyle = col;
  for (const [x, y, r] of circles) { ell(x, y, r, r); ctx.fill(); }
}
function otext(str, x, y, size, fill, font = 'Luckiest Guy', align = 'center', stroke = 8) {
  ctx.font = `${size}px '${font}', Impact, Arial Black, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = stroke; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
  ctx.strokeText(str, x, y); ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

/* ---------------------------------------------------------------------
   Face parts
   --------------------------------------------------------------------- */
function eyes(x1, x2, y, rx, ry, f, skin, opt = {}) {
  const ex = f.expr;
  const big = ex === 'shock' ? 1.15 : 1;
  rx *= big; ry *= big;
  const list = [[x1, 1], [x2, -1]];          // [x, side of the inner corner]
  for (const [x] of list) { ell(x, y, rx, ry); fs('#fff'); }
  // pupils
  const pr = ex === 'shock' ? 2.6 : 3.8;
  ctx.fillStyle = INK;
  for (const [x] of list) { ell(x + 2 + rx * 0.38 * f.lx, y + ry * 0.25 * f.ly, pr, pr); ctx.fill(); }
  // lids (blink / bored / angry / sad)
  let outer = 0, inner = 0;
  if (f.blink) { outer = inner = 1.05; }
  else if (ex === 'bored') { outer = inner = 0.48; }
  else if (ex === 'angry') { outer = 0.12; inner = 0.5; }
  else if (ex === 'sad') { outer = 0.45; inner = 0.15; }
  else if (ex === 'happy') { outer = inner = 0.12; }
  if (outer || inner) {
    for (const [x, side] of list) {
      const yo = y - ry + 2 * ry * outer, yi = y - ry + 2 * ry * inner;
      const xl = x - rx - 3, xr = x + rx + 3;
      const yl = side === 1 ? yo : yi, yR = side === 1 ? yi : yo;
      ctx.save(); ell(x, y, rx, ry); ctx.clip();
      ctx.beginPath(); ctx.moveTo(xl, y - ry - 4); ctx.lineTo(xr, y - ry - 4); ctx.lineTo(xr, yR); ctx.lineTo(xl, yl); ctx.closePath();
      ctx.fillStyle = skin; ctx.fill();
      line([[xl, yl], [xr, yR]], 3);
      ctx.restore();
      ell(x, y, rx, ry); ctx.lineWidth = LW; ctx.strokeStyle = INK; ctx.stroke();
    }
  }
  if (opt.lashes) {
    line([[x2 + rx * 0.7, y - ry * 0.7], [x2 + rx + 6, y - ry - 2]], 2.5);
    line([[x2 + rx * 0.9, y - ry * 0.35], [x2 + rx + 8, y - ry * 0.45]], 2.5);
    line([[x1 - rx * 0.7, y - ry * 0.7], [x1 - rx - 5, y - ry - 2]], 2.5);
  }
  if (opt.brow) {
    const by = y - ry - 7;
    let tilt = 0;
    if (ex === 'angry') tilt = 6; else if (ex === 'sad') tilt = -6; else if (ex === 'shock') tilt = -2;
    const lift = ex === 'shock' ? -7 : 0;
    line([[x1 - rx * 0.8, by + lift - tilt * 0.3], [x1 + rx * 0.6, by + lift + tilt]], 4.5, opt.brow);
    line([[x2 - rx * 0.6, by + lift + tilt], [x2 + rx * 0.8, by + lift - tilt * 0.3]], 4.5, opt.brow);
  }
}
function mouth(x, y, w, f, lip) {
  let o = f.mouth;
  if (f.expr === 'shock') o = Math.max(o, 0.75);
  if (o > 0.08) {
    const h = o * w * 0.6 + 3;
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.quadraticCurveTo(x, y - 3 + (f.expr === 'happy' ? 4 : 0), x + w / 2, y);
    ctx.bezierCurveTo(x + w / 2, y + h * 1.2, x - w / 2, y + h * 1.2, x - w / 2, y);
    ctx.closePath();
    ctx.save(); ctx.fillStyle = '#5a1414'; ctx.fill(); ctx.clip();
    ell(x + 2, y + h * 1.0, w * 0.3, h * 0.45); ctx.fillStyle = '#e8737f'; ctx.fill();
    ctx.restore();
    ctx.lineWidth = lip ? 3.5 : 3; ctx.strokeStyle = lip || INK; ctx.stroke();
  } else {
    let curve = 2;
    if (f.expr === 'happy') curve = 9; else if (f.expr === 'sad' || f.expr === 'angry') curve = -6; else if (f.expr === 'bored') curve = -1;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y - curve * 0.2); ctx.quadraticCurveTo(x, y + curve, x + w / 2, y - curve * 0.35);
    ctx.lineWidth = lip ? 4.5 : 3; ctx.strokeStyle = lip || INK; ctx.lineCap = 'round'; ctx.stroke();
  }
}

/* ---------------------------------------------------------------------
   Heads (drawn facing right, centred near 0,0)
   --------------------------------------------------------------------- */
function headGary(c, f) {
  const s = c.skin, hair = '#5b3a1e';
  ctx.beginPath();
  ctx.moveTo(-30, 46);
  ctx.bezierCurveTo(-60, 30, -58, -52, -4, -58);
  ctx.bezierCurveTo(36, -62, 54, -36, 52, -8);
  ctx.bezierCurveTo(58, 6, 66, 22, 64, 42);
  ctx.bezierCurveTo(62, 66, 30, 74, 6, 64);
  ctx.bezierCurveTo(-10, 58, -20, 54, -30, 46);
  ctx.closePath(); fs(s);
  // the famous big chin crease
  ctx.beginPath(); ctx.moveTo(20, 60); ctx.quadraticCurveTo(38, 66, 56, 56); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  // ear
  ell(-20, 6, 9, 13); fs(s);
  ctx.beginPath(); ctx.arc(-20, 6, 5, -1.2, 1.4); ctx.lineWidth = 2; ctx.stroke();
  // hair
  ctx.beginPath(); ctx.moveTo(-52, 6); ctx.bezierCurveTo(-64, -42, -22, -70, 26, -57);
  ctx.lineTo(14, -48); ctx.lineTo(6, -52); ctx.lineTo(-4, -44); ctx.bezierCurveTo(-26, -44, -34, -26, -36, 4); ctx.closePath(); fs(hair);
  eyes(24, 48, -20, 13, 16, f, s, { brow: hair });
  // nose
  ell(61, 4, 8, 8); fs(s);
  // mustache
  ctx.beginPath(); ctx.moveTo(36, 20); ctx.bezierCurveTo(42, 10, 66, 10, 72, 21);
  ctx.bezierCurveTo(66, 28, 58, 23, 54, 25); ctx.bezierCurveTo(48, 28, 40, 28, 36, 20); ctx.closePath(); fs(hair);
  mouth(51, 36, 24, f);
}
function headDonna(c, f) {
  const s = c.skin, hair = '#7a3a9e';
  blob([[-18, -30, 42], [-44, -4, 30], [8, -50, 32], [-38, -46, 28], [-46, 26, 22], [-22, 30, 20]], hair);
  ctx.beginPath(); ctx.moveTo(-22, 40); ctx.bezierCurveTo(-48, 22, -46, -44, 0, -50);
  ctx.bezierCurveTo(34, -54, 48, -30, 46, -6); ctx.bezierCurveTo(50, 6, 54, 22, 47, 36);
  ctx.bezierCurveTo(40, 52, 16, 58, 2, 52); ctx.bezierCurveTo(-8, 50, -16, 46, -22, 40); ctx.closePath(); fs(s);
  ell(-14, 6, 8, 12); fs(s);
  ell(-13, 24, 4.5, 4.5); fs('#ffd23f');
  // bangs
  ctx.beginPath(); ctx.moveTo(-26, -40); ctx.bezierCurveTo(0, -66, 44, -54, 50, -20);
  ctx.bezierCurveTo(34, -34, 14, -36, -2, -26); ctx.bezierCurveTo(-10, -30, -18, -32, -26, -26); ctx.closePath(); fs(hair);
  eyes(21, 44, -10, 12, 15, f, s, { lashes: true });
  ctx.beginPath(); ctx.moveTo(53, 2); ctx.quadraticCurveTo(60, 10, 52, 14); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  mouth(42, 30, 20, f, '#c0303a');
}
function headTyler(c, f) {
  const s = c.skin, hair = '#e8c35a';
  // hair tufts sticking out of the cap
  ctx.beginPath(); ctx.moveTo(-46, -6); ctx.lineTo(-58, 6); ctx.lineTo(-44, 8); ctx.lineTo(-52, 20); ctx.lineTo(-36, 16); ctx.closePath(); fs(hair);
  ctx.beginPath(); ctx.moveTo(-24, 38); ctx.bezierCurveTo(-52, 20, -48, -48, 0, -50);
  ctx.bezierCurveTo(40, -52, 52, -24, 50, 0); ctx.bezierCurveTo(52, 22, 44, 44, 24, 50);
  ctx.bezierCurveTo(8, 54, -12, 48, -24, 38); ctx.closePath(); fs(s);
  ell(-18, 8, 8, 12); fs(s);
  // backwards cap
  ctx.beginPath(); ctx.moveTo(-48, -10); ctx.bezierCurveTo(-52, -60, 34, -70, 46, -22); ctx.quadraticCurveTo(0, -18, -48, -10); ctx.closePath(); fs('#d23a3a');
  ell(-58, -12, 20, 7, -0.25); fs('#b02a2a');
  ctx.beginPath(); ctx.moveTo(42, -26); ctx.lineTo(48, -18); ctx.lineWidth = 2; ctx.stroke();
  // freckles
  ctx.fillStyle = '#c47a4a';
  for (const [x, y] of [[36, 12], [42, 17], [30, 17], [48, 11]]) { ell(x, y, 1.8, 1.8); ctx.fill(); }
  eyes(19, 41, -12, 12, 14, f, s, { brow: hair });
  ctx.beginPath(); ctx.moveTo(53, 0); ctx.quadraticCurveTo(60, 8, 52, 12); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  mouth(37, 28, 18, f);
}
function headCat(c, f) {
  const s = c.skin, pink = '#f2a0b0', light = '#dfe2e7';
  for (const [bx, tx] of [[-30, -22], [0, 8]]) {
    ctx.beginPath(); ctx.moveTo(bx - 8, -32); ctx.lineTo(tx - 4, -76); ctx.lineTo(bx + 22, -40); ctx.closePath(); fs(s);
    ctx.beginPath(); ctx.moveTo(bx - 1, -36); ctx.lineTo(tx - 3, -64); ctx.lineTo(bx + 14, -40); ctx.closePath(); ctx.fillStyle = pink; ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(-30, 30); ctx.bezierCurveTo(-56, 0, -40, -48, 0, -46);
  ctx.bezierCurveTo(36, -46, 46, -20, 46, -2); ctx.bezierCurveTo(64, 2, 68, 24, 50, 30);
  ctx.bezierCurveTo(36, 40, -10, 44, -30, 30); ctx.closePath(); fs(s);
  // stripes
  line([[-6, -44], [-2, -32]], 4, '#7d838c'); line([[-22, -38], [-14, -28]], 4, '#7d838c'); line([[-40, -18], [-28, -14]], 4, '#7d838c');
  ell(48, 18, 17, 11); ctx.fillStyle = light; ctx.fill();
  eyes(14, 36, -14, 11, 14, f, s);
  ell(63, 8, 6, 4.5); fs(pink, 2.5);
  for (const [dy, len] of [[-2, 30], [6, 32]]) line([[56, 18 + dy * 0.3], [56 + len, 14 + dy]], 1.8);
  for (const [dy, len] of [[-2, 22], [6, 24]]) line([[36, 20 + dy * 0.3], [36 - len, 16 + dy]], 1.8);
  mouth(50, 28, 14, f);
}
function headBrenda(c, f) {
  const s = c.skin, hair = '#3a2416';
  ell(-50, -18, 15, 30, -0.7); fs(hair);
  ell(-38, -28, 7, 7); fs('#ff5fa2');
  ctx.beginPath(); ctx.moveTo(-22, 40); ctx.bezierCurveTo(-48, 22, -46, -44, 0, -50);
  ctx.bezierCurveTo(34, -54, 48, -30, 46, -6); ctx.bezierCurveTo(50, 6, 54, 22, 47, 36);
  ctx.bezierCurveTo(40, 52, 16, 58, 2, 52); ctx.bezierCurveTo(-8, 50, -16, 46, -22, 40); ctx.closePath(); fs(s);
  ell(-14, 6, 8, 12); fs(s);
  ctx.beginPath(); ctx.moveTo(-44, 12); ctx.bezierCurveTo(-56, -44, -6, -64, 28, -50);
  ctx.bezierCurveTo(44, -42, 50, -32, 48, -22); ctx.bezierCurveTo(24, -36, -8, -34, -26, 12); ctx.closePath(); fs(hair);
  eyes(21, 44, -10, 12, 15, f, s, { lashes: true });
  ctx.beginPath(); ctx.moveTo(53, 2); ctx.quadraticCurveTo(60, 10, 52, 14); ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
  mouth(42, 31, 18, f, '#8a2a4a');
  if (c.bubble > 0.02) { ell(46 + c.bubble * 18, 34, c.bubble * 26, c.bubble * 24); fs('rgba(255,120,190,0.92)', 3); ell(40 + c.bubble * 14, 26, c.bubble * 6, c.bubble * 4, -0.5); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill(); }
}

/* torso details */
function detGary(c, sY, hipY, wt) {
  ctx.beginPath(); ctx.moveTo(-14, sY + 2); ctx.lineTo(4, sY + 20); ctx.lineTo(10, sY); ctx.closePath(); fs('#f7f2e6', 2.5);
  ctx.beginPath(); ctx.moveTo(24, sY + 2); ctx.lineTo(10, sY + 22); ctx.lineTo(4, sY + 2); ctx.closePath(); fs('#f7f2e6', 2.5);
  ctx.fillStyle = INK; for (let i = 0; i < 3; i++) { ell(12, sY + 30 + i * 14, 2.2, 2.2); ctx.fill(); }
  rr(-wt - 30, hipY - 6, (wt + 30) * 2, 10, 4); fs('#4a2f1a', 2.5);
}
function detDonna(c, sY) { ctx.fillStyle = '#fff'; for (let i = -3; i <= 3; i++) { ell(6 + i * 7, sY + 10 + Math.abs(i) * -1.5 + 4, 3.4, 3.4); fs('#fffbe8', 1.5); } }
function detTyler(c, sY, hipY) {
  rr(-20, hipY - 44, 52, 28, 10); fs(shade('#3c9a5f', 0.9), 2.5);
  line([[8, sY + 8], [6, sY + 34]], 2.5); line([[18, sY + 8], [20, sY + 32]], 2.5);
  ctx.beginPath(); ctx.moveTo(-26, sY + 4); ctx.quadraticCurveTo(-46, sY - 10, -30, sY - 18); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
}
function detCat(c, sY, hipY) {
  ell(10, sY + 32, 16, 22); ctx.fillStyle = '#dfe2e7'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, sY + 4); ctx.lineTo(-8, sY - 6); ctx.lineTo(-8, sY + 14); ctx.closePath(); fs('#c8202a', 2.5);
  ctx.beginPath(); ctx.moveTo(10, sY + 4); ctx.lineTo(28, sY - 6); ctx.lineTo(28, sY + 14); ctx.closePath(); fs('#c8202a', 2.5);
  ell(10, sY + 4, 4.5, 4.5); fs('#a01820', 2.5);
}
function detBrenda(c, sY, hipY, wt) {
  ctx.beginPath(); ctx.moveTo(-wt + 6, sY + 16); ctx.lineTo(wt + 2, sY + 16); ctx.lineTo(wt + 14, hipY + 10); ctx.lineTo(-wt - 2, hipY + 10); ctx.closePath(); fs('#2f8a4e');
  rr(8, sY + 26, 30, 12, 3); fs('#fff', 2);
  ctx.fillStyle = INK; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BRENDA', 23, sY + 32);
}

/* hand-held props */
function drawItem(type, x, y, a) {
  ctx.save(); ctx.translate(x, y);
  if (type === 'ticket') {
    ctx.rotate(-a + PI); rr(-6, -34, 34, 22, 3); fs('#fff5c4', 2.5);
    line([[0, -27], [22, -27]], 2, '#c0303a'); line([[0, -22], [18, -22]], 1.5, '#888'); line([[0, -17], [22, -17]], 1.5, '#888');
  } else if (type === 'martini') {
    ctx.beginPath(); ctx.moveTo(-16, -40); ctx.lineTo(16, -40); ctx.lineTo(0, -16); ctx.closePath(); fs('rgba(210,240,255,.8)', 2.5);
    line([[0, -16], [0, 2]], 3); line([[-8, 2], [8, 2]], 3);

/* ---------------------------------------------------------------------
   Scene management & rendering
   --------------------------------------------------------------------- */
let scene = { bg: () => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }, chars: [] };
function setScene(s) { if (!s.chars) s.chars = []; scene = s; }

function update(dt) {
  T += dt;
  if (T >= LIMIT && !finished) showEnd();
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], p = clamp((T - tw.start) / tw.d, 0, 1), e = tw.ease(p);
    for (const k in tw.to) tw.o[k] = lerp(tw.from[k], tw.to[k], e);
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  for (let i = waiters.length - 1; i >= 0; i--) if (T >= waiters[i].at) { const w = waiters[i]; waiters.splice(i, 1); w.r(); }
  const all = [...scene.chars, ...(scene.car ? scene.car.occ.map(o => o.c) : [])];
  for (const c of all) {
    if (c.state === 'walk') c.phase += Math.hypot(c.x - c._lx, c.y - c._ly) / (c.b.L1 + c.b.L2) * 1.25;
    c._lx = c.x; c._ly = c.y;
    if (T > c.blinkAt) { c.blinkEnd = T + 0.13; c.blinkAt = T + rand(2, 5); }
    const t = T * 1 + c.seed;
    const target = c.talking ? clamp(0.55 + 0.45 * Math.sin(t * 17) * Math.sin(t * 5.3 + 1) + 0.25 * Math.sin(t * 29), 0, 1) : 0;
    c.mouthV = lerp(c.mouthV, target, clamp(dt * 25, 0, 1));
    c.gest = lerp(c.gest, c.talking && !c.noGest && c.pose !== 'kick' ? 1 : 0, clamp(dt * 5, 0, 1));
  }
  if (scene.puffs) {
    if (scene.smoke && Math.random() < dt * scene.smoke * 6) scene.puffs.push({ x: rand(60, 150), y: 250, r: rand(10, 18), a: 0.7, vy: rand(-40, -25), vx: rand(5, 30) });
    for (const p of scene.puffs) { p.y += p.vy * dt; p.x += p.vx * dt; p.r += dt * 14; p.a -= dt * 0.18; }
    scene.puffs = scene.puffs.filter(p => p.a > 0);
  }
  const car = scene.car;
  if (car) {
    car.wheel += car.speed * dt / 34;
    car.bounce = car.speed > 0 || car.idle ? Math.sin(T * 22) * 1.5 + (Math.random() - .5) * 0.8 : 0;
    if (scene.scroll !== undefined) scene.scroll += car.speed * dt;
    if (car.speed > 0 || car.idle) { if (Math.random() < dt * 14) car.exhaust.push({ x: car.x - 220 * car.scale, y: car.y - 34 * car.scale, r: 6, a: 0.6 }); }
    for (const p of car.exhaust) { p.x -= dt * (60 + car.speed * 0.6); p.y -= dt * 12; p.r += dt * 18; p.a -= dt * 0.9; }
    car.exhaust = car.exhaust.filter(p => p.a > 0);
    for (const o of car.occ) { o.c.x = car.x + o.dx * car.scale; o.c.y = car.y + car.bounce + o.dy * car.scale; o.c.scale = o.s * car.scale; }
  }
}

function render() {
  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  scene.bg(scene);
  const sorted = [...scene.chars].sort((a, b) => (a.z - b.z) || (a.y - b.y));
  if (scene.car) { drawCarBack(scene.car); for (const o of scene.car.occ) drawChar(o.c); drawCarFront(scene.car); }
  for (const c of sorted) if (c.behind) drawChar(c);
  if (scene.mid) scene.mid(scene);
  for (const c of sorted) if (!c.behind) drawChar(c);
  if (scene.fg) scene.fg(scene);
  ctx.restore();

  // screen-space overlays
  if (fx.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${fx.flash})`; ctx.fillRect(0, 0, W, H); }
  if (fx.wipe > 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W * fx.wipe, H); }
  if (fx.iris >= 0) {
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(fx.irisX, fx.irisY, Math.max(0, fx.iris), 0, TAU, true);
    ctx.fillStyle = '#000'; ctx.fill('evenodd');
  }
  if (fx.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fx.fade})`; ctx.fillRect(0, 0, W, H); }
  if (scene.overlay) scene.overlay(scene);
  if (subsOn && sub) drawSub(sub);
  if (started && !finished) {
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(0, 0, W * clamp(T / LIMIT, 0, 1), 6);
    ctx.font = 'bold 18px Arial'; ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText(`0:${String(Math.min(LIMIT, Math.floor(T))).padStart(2, '0')} / 0:${LIMIT}`, W - 14, 14);
  }
  if (paused && started) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    otext('PAUSED', 640, 360, 80, '#ffd23f');
  }
}
function wrapText(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawSub(s) {
  ctx.font = "600 26px Arial, Helvetica, sans-serif";
  const lines = wrapText(s.text, 980);
  const h = 22 + lines.length * 34 + 30, y = H - h - 18;
  ctx.fillStyle = 'rgba(0,0,0,.66)'; rr(640 - 520, y, 1040, h, 14); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = "bold 20px Arial"; ctx.fillStyle = s.c.color; ctx.fillText(s.c.name.toUpperCase(), 640, y + 10);
  ctx.font = "600 26px Arial, Helvetica, sans-serif"; ctx.fillStyle = '#fff';
  lines.forEach((l, i) => ctx.fillText(l, 640, y + 38 + i * 34));
}

// final card shown when the short ends (or when the 40 s cap is reached)
function showEnd() {
  if (finished) return;
  finished = true;
  gen++; waiters.length = 0; tweens.length = 0;
  if (synth) synth.cancel();
  engineOff(); sub = null;
  for (const c of [...scene.chars, ...(scene.car ? scene.car.occ.map(o => o.c) : [])]) c.talking = false;
  Object.assign(fx, { fade: 0, wipe: 0, iris: -1, flash: 0 });
  const last = curShort === SHORTS.length - 1;
  setScene({ bg: drawTitle, endCard: true, overlay: () => {
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
    otext('The Buckleys', 640, 230, 110, '#ffd23f', 'Lobster', 'center', 12);
    otext(last ? 'THE END' : `Next: Short #${curShort + 2} "${SHORTS[curShort + 1].name}"`, 640, 380, last ? 70 : 44, '#ffffff');
    ctx.fillStyle = '#ddd'; ctx.font = '22px Arial'; ctx.textAlign = 'center';
    ctx.fillText(last ? 'Press ⟲ Replay or pick a short below' : 'Press ⏭ Next or click the screen', 640, 470);
  } });
  setCam(640, 360, 1);
}

async function runShort(n) {
  gen++; const my = gen;
  waiters.length = 0; tweens.length = 0;
  if (synth) synth.cancel();
  engineOff(); sub = null;
  T = 0; finished = false; curShort = n; paused = false; bPause.textContent = '⏸ Pause';
  Object.assign(fx, { fade: 1, wipe: 0, iris: -1, flash: 0 });
  setCam(640, 360, 1);
  await SHORTS[n].run();
  if (my === gen) { await wait(0.4); if (my === gen) showEnd(); }
}

/* ---------------------------------------------------------------------
   Main loop & controls
   --------------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (started && !paused) update(dt * SPEED);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const overlay = document.getElementById('overlay');
function start() {
  if (started) return;
  started = true; overlay.style.display = 'none';
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  if (synth) {   // unlock speech on mobile browsers while we are still inside the click
    synth.cancel(); loadVoices();
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u);
  }
  runShort(clamp(parseInt(params.get('ep') || '1', 10) - 1 || 0, 0, SHORTS.length - 1));
}
document.getElementById('play').addEventListener('click', e => { e.stopPropagation(); start(); });
overlay.addEventListener('click', start);
const bPause = document.getElementById('bPause');
bPause.onclick = () => {
  if (!started) return;
  paused = !paused;
  bPause.textContent = paused ? '▶ Play' : '⏸ Pause';
  if (AC) paused ? AC.suspend() : AC.resume();
  if (synth) paused ? synth.pause() : synth.resume();
};
function go(n) { if (!started) { params.set('ep', n + 1); start(); return; } runShort(n); }
document.getElementById('bRestart').onclick = () => go(curShort);
document.getElementById('bNext').onclick = () => go((curShort + 1) % SHORTS.length);
document.querySelectorAll('[data-ep]').forEach(btn => btn.addEventListener('click', e => { e.stopPropagation(); const n = +btn.dataset.ep; if (!started) { params.set('ep', n + 1); start(); } else go(n); }));
cv.addEventListener('click', () => { if (finished && curShort < SHORTS.length - 1) go(curShort + 1); });
const bVoice = document.getElementById('bVoice');
bVoice.onclick = () => { voiceOn = !voiceOn; bVoice.classList.toggle('off', !voiceOn); if (!voiceOn && synth) synth.cancel(); };
if (!voiceOn) bVoice.classList.add('off');
const bSubs = document.getElementById('bSubs');
bSubs.onclick = () => { subsOn = !subsOn; bSubs.classList.toggle('off', !subsOn); };
document.getElementById('bFull').onclick = () => { const w = document.getElementById('wrap'); if (document.fullscreenElement) document.exitFullscreen(); else if (w.requestFullscreen) w.requestFullscreen(); };
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); started ? bPause.onclick() : start(); } });
if (params.get('autoplay') === '1') start();
</script>
</body>
</html>
